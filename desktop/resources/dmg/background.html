<!doctype html>
<!--
  The macOS installer window's background (540x380 points). scripts/dmg-background.mjs
  renders it to background.tiff at 1x and 2x; the icon positions match "dmg.contents"
  in package.json: Onward at (150, 204), Applications at (390, 204), 96pt icons.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    @font-face {
      font-family: 'Literata Variable';
      src: url('../../onboarding/literata.woff2') format('woff2-variations');
      font-weight: 200 900;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body {
      position: relative;
      width: 540px;
      height: 380px;
      overflow: hidden;
      /* The desk. Finder draws icon labels black in light mode and white in dark mode,
         over this picture; at this lightness both read at about 4.6:1. */
      background: oklch(0.565 0.03 62);
      font: 13px/1.45 -apple-system, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      color: oklch(0.25 0.018 60);
    }
    .sheet {
      position: absolute;
      left: 36px;
      right: 36px;
      border-radius: 9px;
      background: oklch(0.99 0.004 85);
      box-shadow: 0 1px 2px rgb(40 25 10 / 0.25), 0 14px 26px -16px rgb(40 25 10 / 0.6);
    }
    .head { top: 30px; display: flex; align-items: center; gap: 16px; padding: 18px 22px; }
    .head svg { flex: none; width: 40px; height: 40px; }
    h1 { margin: 0 0 2px; font: 600 21px/1.15 'Literata Variable', Georgia, serif; letter-spacing: -0.015em; }
    .head p { margin: 0; color: oklch(0.44 0.02 65); }
    .arrow { position: absolute; left: 214px; top: 186px; width: 112px; height: 36px; }
    .note { bottom: 22px; padding: 9px 16px 10px; font-size: 11.5px; line-height: 1.4; color: oklch(0.44 0.02 65); }
    .note b { color: oklch(0.25 0.018 60); font-weight: 600; }
  </style>
</head>
<body>
  <div class="sheet head">
    <svg viewBox="0 0 64 64" aria-hidden="true">
      <rect width="64" height="64" rx="15" fill="oklch(0.53 0.15 44)"/>
      <path d="M47 32 L36.17 22.31 A13 13 0 1 0 36.17 41.69 Z" fill="none" stroke="oklch(0.99 0.004 85)" stroke-width="7" stroke-miterlimit="10"/>
    </svg>
    <div>
      <h1>Install Onward</h1>
      <p>Drag Onward onto Applications, then open it from there.</p>
    </div>
  </div>

  <svg class="arrow" viewBox="0 0 112 36" aria-hidden="true">
    <path d="M6 18 H100 M88 7 L101 18 L88 29" fill="none" stroke="oklch(0.99 0.004 85)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>

  <p class="sheet note">The first time you open it, macOS may say it can't verify Onward. Close that message, then choose <b>Open Anyway</b> in System Settings › Privacy &amp; Security.</p>
</body>
</html>
